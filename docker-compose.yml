# FreshLink development services.
#
# Start:   docker compose up -d        (from the FreshLink folder)
# Stop:    docker compose down          (data is kept in the "pgdata" volume)
# Status:  docker compose ps
#
# Values like ${POSTGRES_PASSWORD} come from the ".env" file next to this file
# (copy ".env.example" to ".env"). The real .env is never committed.
#
# Later stages add the "api" and "worker" services here.

services:
  db:
    image: postgres:17-alpine
    container_name: freshlink-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-freshlink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env file}
      POSTGRES_DB: ${POSTGRES_DB:-freshlink}
    ports:
      # 127.0.0.1 = only this computer can connect (not the whole network)
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-freshlink} -d ${POSTGRES_DB:-freshlink}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
