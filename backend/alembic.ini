# Alembic configuration (database migrations).
#
# Common commands, run from the backend/ folder with the venv active:
#   alembic upgrade head                         apply all migrations
#   alembic downgrade -1                         undo the last migration
#   alembic revision --autogenerate -m "msg"     create a migration from model changes
#   alembic current                              show which migration the DB is at
#
# The database URL is NOT written here (it would contain the password).
# alembic/env.py reads it from the same settings the API uses.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
# Files are named like 20261114_1200_0001_enable_postgres_extensions.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
